name: Temporary format ecash.mx change

on:
  push:
    branches:
      - content/roadmap-tonalli-memo-links
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed source
        run: npx prettier --write index.html assets/css/network.css scripts/ecosystem-links.test.mjs package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/network.css scripts/ecosystem-links.test.mjs package.json
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: apply repository formatting"
          git push origin HEAD:content/roadmap-tonalli-memo-links
