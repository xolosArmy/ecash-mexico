name: PR 35 formatting preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-preview:
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Format and emit patch
        run: |
          npx --no-install prettier --write blog/comprar-xec-en-mexico.html comprar-xec/index.html index.html
          git diff -- blog/comprar-xec-en-mexico.html comprar-xec/index.html index.html
      - run: npm run lint
      - run: npm test
